services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: osi
      POSTGRES_USER: osi
      POSTGRES_PASSWORD: osi_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
